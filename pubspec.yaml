name: ecopulse_mobile
description: "Aplicativo mobile do EcoPulse para monitoramento ambiental geoespacial."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  connectivity_plus: ^5.0.2
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true